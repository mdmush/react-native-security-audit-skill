schema_version: "1.1"
name: expo-public-env-keys
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A focused answer, no report artifacts. It confirms that EXPO_PUBLIC_ values are
  inlined into the app bundle, then separates the keys: the AI provider key used
  directly from lib/assistant.ts is a real secret that must be rotated and moved
  behind a backend; the Supabase anon key (JWT with role anon) and the Sentry DSN
  are public identifiers that are fine to ship, with row-level security being
  what protects Supabase data. It does not suggest another env var mechanism as
  the fix and does not print the AI key in full.
